<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav><a href="index.html">Ask Once</a> · Chat (P5) · <a href="analyze.html">Analyze (P6)</a></nav>
      <h1>Chat</h1>
      <p class="lead">Every time, the page sends the whole conversation. That list is the model's only memory.</p>

      <ul id="log"></ul>

      <form id="chat-form">
        <input id="question" type="text" maxlength="500" autocomplete="off"
               placeholder="Type a message" required />
        <button id="send" type="submit">Send</button>
        <button id="reset" type="button" class="plain">New chat</button>
      </form>

      <p id="status"></p>
    </main>
    <script type="module" src="chat.js"></script>
  </body>
</html>
